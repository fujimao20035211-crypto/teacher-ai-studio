<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教材イメージ翻訳ツール</title>
<style>
body{
  margin:0;
  font-family:"Yu Gothic","Hiragino Sans",sans-serif;
  background:#f7f3ea;
  color:#333;
}
header{
  background:#4f7f7b;
  color:white;
  padding:24px;
  text-align:center;
}
main{
  max-width:900px;
  margin:auto;
  padding:20px;
}
section{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}
h2{
  color:#4f7f7b;
  border-left:8px solid #f2b56b;
  padding-left:10px;
}
label{
  display:block;
  font-weight:bold;
  margin-top:12px;
}
input,textarea,select{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}
textarea{
  min-height:80px;
}
button{
  padding:14px 24px;
  border:none;
  border-radius:999px;
  background:#4f7f7b;
  color:white;
  font-weight:bold;
  font-size:16px;
  margin:8px 6px 8px 0;
  cursor:pointer;
}
button.copy{
  background:#f2b56b;
  color:#333;
}
#output{
  min-height:260px;
  border:2px solid #4f7f7b;
}
.note{
  background:#fff8e5;
  border:2px solid #f2d38b;
}
</style>
</head>

<body>
<header>
  <h1>教材イメージ翻訳ツール</h1>
  <p>先生のアイデアを、画像生成AIに伝わりやすい言葉へ変換します。</p>
</header>

<main>

<section class="note">
  <p>児童生徒名、学校名、写真、個人情報は入力しないでください。</p>
</section>

<section>
  <h2>1. 先生のアイデア</h2>
  <label>教材画像のテーマ</label>
  <input id="theme" placeholder="例：宇宙のアイスクリーム屋さん">

  <label>どんな場面にしたいですか？</label>
  <textarea id="scene" placeholder="例：宇宙空間にかわいいアイスクリーム屋さんがあり、子どもたちがわくわくしている"></textarea>
</section>

<section>
  <h2>2. 画像の使い道</h2>
  <label>用途</label>
  <select id="purpose">
    <option value="">選んでください</option>
    <option>教材の背景</option>
    <option>導入スライド</option>
    <option>カード画像</option>
    <option>選択肢の画像</option>
    <option>ボタン画像</option>
    <option>ごほうび画面</option>
  </select>

  <label>その他の用途</label>
  <input id="purposeOther" placeholder="例：朝の会で見せる画像">
</section>

<section>
  <h2>3. 雰囲気</h2>
  <select id="mood">
    <option value="">選んでください</option>
    <option>わくわく</option>
    <option>やさしい</option>
    <option>楽しい</option>
    <option>落ち着いた</option>
    <option>少しドキドキ</option>
    <option>達成感がある</option>
  </select>

  <label>その他の雰囲気</label>
  <input id="moodOther" placeholder="例：不思議、夢の中、冒険感">
</section>

<section>
  <h2>4. 絵柄</h2>
  <select id="style">
    <option value="">選んでください</option>
    <option>かわいいアニメ調</option>
    <option>絵本風</option>
    <option>教材イラスト風</option>
    <option>やわらかいデフォルメ調</option>
    <option>小学生向けアニメ風</option>
  </select>

  <label>その他の絵柄</label>
  <input id="styleOther" placeholder="例：絵本とアニメの中間、探検隊風">
</section>

<section>
  <h2>5. 色合い</h2>
  <select id="color">
    <option value="">選んでください</option>
    <option>淡い水色</option>
    <option>クリーム色</option>
    <option>夕焼けオレンジ</option>
    <option>森の緑</option>
    <option>やさしいピンク</option>
    <option>少しコントラスト強め</option>
  </select>

  <label>その他の色合い</label>
  <input id="colorOther" placeholder="例：夜空だけど暗すぎない青紫">
</section>

<section>
  <h2>6. キャラクター・表情</h2>
  <select id="face">
    <option value="">選んでください</option>
    <option>丸い顔、大きな目、笑顔</option>
    <option>表情が分かりやすい</option>
    <option>わくわくした表情</option>
    <option>親しみやすい表情</option>
    <option>少しアニメ化した顔</option>
  </select>

  <label>その他の表情</label>
  <input id="faceOther" placeholder="例：リアルすぎない、目を大きく">
</section>

<section>
  <h2>7. 入れてほしい物・避けたい物</h2>
  <label>入れてほしい物</label>
  <textarea id="include" placeholder="例：星、宇宙船、アイスクリーム屋台"></textarea>

  <label>入れてほしくない物</label>
  <textarea id="exclude" placeholder="例：文字、看板、ロゴ、暗すぎる背景"></textarea>
</section>

<button onclick="makePrompt()">プロンプトを作成</button>
<button class="copy" onclick="copyPrompt()">コピー</button>

<section>
  <h2>完成したプロンプト</h2>
  <textarea id="output" placeholder="ここに完成したプロンプトが表示されます。"></textarea>
</section>

</main>

<script>
function v(id){
  return document.getElementById(id).value.trim();
}

function makePrompt(){
  const theme = v("theme") || "先生が考えた教材テーマ";
  const scene = v("scene");
  const purpose = [v("purpose"), v("purposeOther")].filter(Boolean).join("、");
  const mood = [v("mood"), v("moodOther")].filter(Boolean).join("、");
  const style = [v("style"), v("styleOther")].filter(Boolean).join("、");
  const color = [v("color"), v("colorOther")].filter(Boolean).join("、");
  const face = [v("face"), v("faceOther")].filter(Boolean).join("、");
  const include = v("include");
  const exclude = v("exclude");

  let prompt = "";

  prompt += "特別支援学校の教材で使う、子ども向けの明るく親しみやすいイラストを作成してください。\\n\\n";
  prompt += "テーマは「" + theme + "」です。\\n";

  if(scene) prompt += "場面は「" + scene + "」です。\\n";
  if(purpose) prompt += "画像の使い道は「" + purpose + "」です。\\n";
  if(mood) prompt += "全体の雰囲気は「" + mood + "」にしてください。\\n";
  if(style) prompt += "絵柄は「" + style + "」にしてください。\\n";
  if(color) prompt += "背景色や色合いは「" + color + "」を意識してください。\\n";
  if(face) prompt += "キャラクターの顔や表情は「" + face + "」を意識してください。\\n";
  if(include) prompt += "入れてほしい物は「" + include + "」です。\\n";
  if(exclude) prompt += "入れてほしくない物は「" + exclude + "」です。\\n";

  prompt += "\\n教材として使いやすいように、以下の条件を守ってください。\\n";
  prompt += "・文字、看板、ロゴ、説明文は入れない。\\n";
  prompt += "・刺激の強い原色は避ける。\\n";
  prompt += "・細かすぎる装飾は避ける。\\n";
  prompt += "・主役が一目で分かる構図にする。\\n";
  prompt += "・授業で使いやすいように少し余白を残す。\\n";
  prompt += "・背景は淡すぎず、主役が埋もれないようにする。\\n";
  prompt += "・過度にリアルにせず、やさしく楽しい印象にする。\\n";

  document.getElementById("output").value = prompt;
}

function copyPrompt(){
  const output = document.getElementById("output");
  output.select();
  document.execCommand("copy");
  alert("コピーしました");
}
</script>

</body>
</html>
